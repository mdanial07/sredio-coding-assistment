<div class="other-expenses">
  <div class="other-expenses-title">Other Expenses</div>
  <mat-accordion>
    <mat-expansion-panel [expanded]="true" (opened)="panelOpenState.set(true)" (closed)="panelOpenState.set(false)">
      <mat-expansion-panel-header>
        <mat-panel-title> Vendor Invoice </mat-panel-title>
      </mat-expansion-panel-header>
      <div class="other-expenses-details">
        <div>
          <ag-grid-angular 
            class="ag-theme-quartz" 
            style="width: 100%; height: 301px;"
            [rowHeight]="rowHeight"
            [rowData]="rowData"
            [columnDefs]="colDefs"
            [grandTotalRow]="grandTotalRow"
            [groupIncludeTotalFooter]="true"
            (gridReady)="onGridReady($event)"
          />
        </div>
      </div>
    </mat-expansion-panel>
  </mat-accordion>
  <div class="AddButton">
    <div class="btn-add">Add Vendor Invoice</div>
  </div>
  <div>
    <mat-accordion>
      <mat-expansion-panel [expanded]="true" (opened)="panelOpenState2.set(true)" (closed)="panelOpenState2.set(false)">
        <mat-expansion-panel-header>
          <mat-panel-title> Government Assistance </mat-panel-title>
        </mat-expansion-panel-header>
        <div class="other-expenses-details">
          <div class="expense-body">
            <div class="label">Total Amount of Government Assistance</div>
            <input type="number">
          </div>
          <div class="expense-actions">
            <div class="btn cancel">Cancel</div>
            <div class="btn save">Save</div>
          </div>
        </div>
      </mat-expansion-panel>
    </mat-accordion>
  </div>
</div>
